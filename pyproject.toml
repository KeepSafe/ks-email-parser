[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ks-email-parser"
version = "1.0.0"
description = "A command line tool to render HTML and text emails of markdown content."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [
    {name = "Keepsafe", email = "support@getkeepsafe.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "beautifulsoup4==4.14.3",
    "cssutils==2.11.1",
    "inlinestyler==0.2.1",
    "lxml==4.9.4",
    "Markdown==2.6.11",
    "parse==1.19.0",
    "pystache==0.6.8",
]

[project.optional-dependencies]
devtools = [
    "build==1.3.0",
    "pyupgrade==3.21.2",
    "twine==6.2.0",
]
tests = [
    "coverage==7.12.0",
    "flake8==7.3.0",
    "flake8-pyproject==1.2.3",
    "pynose==1.5.4",
]

[project.scripts]
ks-email-parser = "email_parser.cmd:main"

[project.urls]
Homepage = "https://github.com/KeepSafe/ks-email-parser"

[tool.setuptools.packages.find]
include = ["email_parser*"]

[tool.flake8]
max-line-length = 120
ignore = ["F401", "F403", "F405"]
